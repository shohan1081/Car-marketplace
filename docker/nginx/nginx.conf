# ===========================================================================
# Main nginx configuration.
#
# The per-site server block lives in a separate file that compose mounts at
# /etc/nginx/conf.d/default.conf -- either app.http.conf (before you have a
# TLS certificate) or app.https.conf (after). Switch between them with the
# NGINX_CONF variable in .env.
# ===========================================================================

# One worker per CPU core. On a 2-vCPU EC2 instance this becomes 2.
worker_processes auto;

# Errors go to stderr so `docker compose logs nginx` shows them.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker. 1024 x 2 workers is far more
    # than a single marketplace API will ever need.
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $http_x_forwarded_for is included because, behind any future load
    # balancer, $remote_addr would just be the balancer's own address.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /dev/stdout main;

    # Do not advertise the exact nginx version in response headers.
    server_tokens off;

    # sendfile + tcp_nopush: the kernel streams video files straight from disk
    # to the socket without copying them through nginx's own memory. This is
    # what makes serving reels cheap.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---------------------------------------------------------------------
    # Upload limits
    # ---------------------------------------------------------------------
    # Dealer reels are videos, so the default 1 MB would reject almost every
    # upload with a 413. Raise this if you ever allow longer reels.
    client_max_body_size 200M;
    client_body_timeout 300s;
    client_body_buffer_size 1m;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    # JSON API responses and admin CSS/JS compress very well. Video and images
    # are already compressed, so they are deliberately left out.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Backends
    # ---------------------------------------------------------------------
    # "web" and "ws" are the docker-compose service names. Docker's internal
    # DNS resolves them to the containers' private IPs.
    upstream django_http {
        server web:8000;
        keepalive 32;
    }

    upstream django_ws {
        server ws:8000;
    }

    include /etc/nginx/conf.d/*.conf;
}
