# ===========================================================================
# HTTPS site config -- switch to this AFTER certbot has issued a certificate.
#
# ${DOMAIN} is filled in at container start from the DOMAIN variable in .env,
# by the nginx image's built-in envsubst step. Do not edit this file to add
# your domain; set DOMAIN in .env instead.
# ===========================================================================

# -------------------------------------------------------------------------
# Port 80: only two jobs -- serve the ACME challenge, and push everyone to
# HTTPS. No application traffic is served here any more.
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Certificate renewal must keep working over plain HTTP, so this location
    # is deliberately excluded from the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------------
# Port 443: the real site.
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # Issued by certbot into the shared certbot_conf volume.
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS 1.2 is kept for older Android devices; anything below it is unsafe.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Tells browsers never to try plain HTTP for this domain again.
    # Only enable once HTTPS is confirmed working -- it is hard to undo,
    # because browsers cache it for the full max-age.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        # Deliberately short. These filenames are NOT content-hashed, so a long
        # cache would leave browsers on stale admin CSS for weeks after a
        # Django or django-unfold upgrade.
        expires 1d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSockets -> daphne
    location /ws/ {
        proxy_pass http://django_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Everything else -> gunicorn
    location / {
        proxy_pass http://django_http;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
