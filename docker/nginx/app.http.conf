# ===========================================================================
# HTTP-only site config -- use this FIRST, before you have a TLS certificate.
#
# It serves the whole application over plain http:// and also exposes the
# /.well-known/acme-challenge/ path that Let's Encrypt needs in order to prove
# you control the domain. Once the certificate exists, switch .env to
#   NGINX_CONF=app.https.conf
# and restart nginx.
# ===========================================================================

server {
    listen 80;
    listen [::]:80;

    # "_" matches any Host header. Correct here because the certificate step
    # has not happened yet and you may still be testing via the raw EC2 IP.
    server_name _;

    # -----------------------------------------------------------------------
    # Let's Encrypt HTTP-01 challenge
    # -----------------------------------------------------------------------
    # certbot writes a token file into this shared volume; Let's Encrypt then
    # fetches it over plain HTTP to verify the domain.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # -----------------------------------------------------------------------
    # Static files (Django admin + django-unfold assets)
    # -----------------------------------------------------------------------
    # collectstatic wrote these; nginx serves them straight from disk so no
    # gunicorn worker is ever occupied by a CSS request.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        # Deliberately short. These filenames are NOT content-hashed, so a long
        # cache would leave browsers on stale admin CSS for weeks after a
        # Django or django-unfold upgrade.
        expires 1d;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------------------
    # Media files (reels, AI videos, dealer logos, licences)
    # -----------------------------------------------------------------------
    # nginx answers HTTP Range requests natively, which is what lets the mobile
    # app seek inside a reel without downloading the whole file.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------------------
    # WebSockets -> daphne
    # -----------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://django_ws;

        # These three headers are what turn a normal HTTP request into a
        # persistent WebSocket connection. Without them the handshake fails.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat socket is idle most of the time. The default 60s would cut it
        # off constantly, so allow a full week of silence.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # -----------------------------------------------------------------------
    # Everything else -> gunicorn (REST API + admin)
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://django_http;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Django needs Host to validate against ALLOWED_HOSTS, and
        # X-Forwarded-Proto to know the original request was https.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must be >= gunicorn's --timeout, otherwise nginx returns 504 while
        # the worker is still doing legitimate work (e.g. probing a video).
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
